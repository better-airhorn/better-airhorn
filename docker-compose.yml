# Production stack. Run with: docker compose --env-file ./env/better-airhorn.env up -d --build
# Host folders live under ${DATA_ROOT}; see DEPLOYMENT.md for ownership and the upgrade runbook.

services:
  slashbackend:
    build:
      context: .
      dockerfile: apps/slashbackend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '8080'
    networks:
      - databases
      - backend
      - nexternal
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DISCORD_APP_ID: ${DISCORD_APP_ID}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      VOICENODE_URL: http://voicenode:8888
      VOICENODE_ACCESS_KEY: ${VOICENODE_ACCESS_KEY}
      TOPGG_WEBHOOK_SECRET: ${TOPGG_WEBHOOK_SECRET:-}
      BOTLISTS_DBL_SECRET: ${BOTLISTS_DBL_SECRET:-}
      # unset uses the built-in owner ids; an empty value means no admins
      ADMIN_IDS:
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: always

  voicenode:
    build:
      context: .
      dockerfile: apps/voicenode/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '8888'
    networks:
      - databases
      - backend
    volumes:
      - ${DATA_ROOT:-./data}/sounds:/data/sounds
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      VOICENODE_ACCESS_KEY: ${VOICENODE_ACCESS_KEY}
      BOTLISTS_TOPGG: ${BOTLISTS_TOPGG:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: always

  postgres:
    image: postgres:17-alpine
    volumes:
      - ${DATA_ROOT:-./data}/pgsql17:/var/lib/postgresql/data
    networks:
      - databases
    expose:
      - '5432'
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: always
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  ## BACKUPS

  # daily rsync mirror of the sound files; see DEPLOYMENT.md
  soundsbackup:
    image: alpine:3.22
    restart: always
    volumes:
      - ${DATA_ROOT:-./data}/sounds:/sounds:ro
      - ${BACKUP_ROOT:-./backups}/sounds:/mirror
    command:
      - sh
      - -c
      - |
        apk add --no-cache rsync >/dev/null
        while true; do
          # an empty source (e.g. an unmounted disk) skips the run, so it can never wipe the mirror
          if [ -n "$$(ls -A /sounds)" ]; then
            rsync -a --delete /sounds/ /mirror/ && echo "$$(date -u +%FT%TZ) mirrored $$(ls /mirror | wc -l) sound files"
          else
            echo "$$(date -u +%FT%TZ) sounds folder is empty, skipping"
          fi
          sleep 86400
        done

  pgbackups:
    image: prodrigestivill/postgres-backup-local:17
    restart: always
    user: postgres:postgres
    volumes:
      - ${BACKUP_ROOT:-./backups}/postgres:/backups
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=postgres metabase
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_EXTRA_OPTS=-Z6 --schema=public --blobs
      - SCHEDULE=@every 5h
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080
    networks:
      - databases

  ## STATISTICS

  uptime-proxy:
    image: ghcr.io/better-airhorn/uptime-proxy:1.0.1
    networks:
      - databases
      - backend
      - nexternal
    environment:
      PORT: 9999
      monit_postgres: postgres:5432
      monit_voicenode: http://voicenode:8888/health
      monit_slashbackend: http://slashbackend:8080/health
    restart: always

  metabase:
    # Metabase cannot downgrade its application database: only move this tag forward
    image: metabase/metabase:v0.65.2.4
    ports:
      - '127.0.0.1:3388:3000'
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: postgres
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: postgres
      MB_DB_FILE: /metabase-data/metabase.db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - databases
    volumes:
      - ${DATA_ROOT:-./data}/stats:/metabase-data
    restart: always

  # dashboards as code: edit monitoring/grafana/dashboards/*.json, see monitoring/README.md
  grafana:
    image: grafana/grafana:13.2.5
    ports:
      - '127.0.0.1:3389:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in the env file}
      # password of the grafana_ro database role, read by the provisioned datasource
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in the env file}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/better-airhorn.json
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      # the Postgres datasource is built in, so nothing is downloaded on start
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - databases
    restart: always

networks:
  databases:
  backend:
  nexternal:
    external: true
