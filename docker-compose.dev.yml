# Local stack with a public HTTPS URL for Discord interactions. See DEVELOPMENT.md.
#   docker compose -f docker-compose.dev.yml up --build
#   docker compose -f docker-compose.dev.yml logs cloudflared | grep trycloudflare.com

services:
  slashbackend:
    build:
      context: .
      dockerfile: apps/slashbackend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # the tunnel reaches slashbackend over the compose network; the host port is only for local curl
      - '127.0.0.1:${SLASHBACKEND_HOST_PORT:-8080}:8080'
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DISCORD_APP_ID: ${DISCORD_APP_ID}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      VOICENODE_URL: http://voicenode:8888
      VOICENODE_ACCESS_KEY: ${VOICENODE_ACCESS_KEY:-dev}
      BOTLISTS_DBL_SECRET: ${BOTLISTS_DBL_SECRET:-}
      DEV_GUILD_IDS: ${DEV_GUILD_IDS:-}
      # unset uses the built-in owner ids; an empty value means no admins
      ADMIN_IDS:
      LOG_LEVEL: ${LOG_LEVEL:-debug}

  voicenode:
    build:
      context: .
      dockerfile: apps/voicenode/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - sounds:/data/sounds
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      VOICENODE_ACCESS_KEY: ${VOICENODE_ACCESS_KEY:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-debug}

  postgres:
    image: postgres:17-alpine
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  # quick tunnel: a random https://<name>.trycloudflare.com URL that changes on every restart
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    command: tunnel --url http://slashbackend:8080
    depends_on:
      - slashbackend

volumes:
  pgdata:
  sounds:
